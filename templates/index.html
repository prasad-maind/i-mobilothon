<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>VW Group · Logistics Readiness</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════
   DESIGN TOKENS — VW White / OpenAI-style
   Brand accent: #008C82 (VW Teal)
═══════════════════════════════════════════════════ */
:root {
  --bg:           #FFFFFF;
  --bg-subtle:    #F7F7F8;
  --bg-hover:     #F0F0F0;
  --surface:      #FFFFFF;
  --surface-2:    #F4F4F5;
  --border:       #E5E5E5;
  --border-2:     #EBEBEB;
  --divider:      #EFEFEF;

  --teal:         #008C82;
  --teal-light:   #00B5A8;
  --teal-dim:     rgba(0, 140, 130, 0.09);
  --teal-border:  rgba(0, 140, 130, 0.22);

  --text:         #0D0D0D;
  --text-2:       #545454;
  --text-3:       #9B9B9B;
  --text-4:       #C4C4C4;

  --green:        #18A558;
  --orange:       #E07B39;
  --red:          #D03030;
  --yellow:       #B08000;
  --blue:         #1A6FD4;

  --send-bg:      #0D0D0D;
  --send-hover:   #2A2A2A;

  --r-xs:  4px;
  --r-sm:  8px;
  --r-md:  12px;
  --r-lg:  16px;
  --r-xl:  20px;
  --r-full: 9999px;
}

[data-theme="dark"] {
  --bg:          #0D0D0D;
  --bg-subtle:   #1A1A1A;
  --bg-hover:    #262626;
  --surface:     #141414;
  --surface-2:   #242424;
  --border:      #2E2E2E;
  --border-2:    #333333;
  --divider:     #252525;
  --text:        #EFEFEF;
  --text-2:      #ABABAB;
  --text-3:      #666666;
  --text-4:      #444444;
  --send-bg:     #E8E8E8;
  --send-hover:  #FFFFFF;
}
[data-theme="dark"] #sendBtn:not(:disabled) svg { stroke: #1A1A1A; }

/* ── Theme toggle ── */
.theme-switch { position: relative; width: 36px; height: 20px; flex-shrink: 0; }
.theme-switch input { opacity: 0; width: 0; height: 0; position: absolute; }
.theme-slider {
  position: absolute; inset: 0; background: var(--border);
  border-radius: 999px; cursor: pointer; transition: background .2s;
}
.theme-slider::before {
  content: ""; position: absolute; width: 14px; height: 14px; left: 3px; top: 3px;
  background: #fff; border-radius: 50%; transition: transform .2s;
}
.theme-switch input:checked + .theme-slider { background: var(--teal); }
.theme-switch input:checked + .theme-slider::before { transform: translateX(16px); }

/* ── Reset ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { height: 100%; }
body {
  font-family: "Inter", "VWAG TheSans", "Segoe UI", system-ui, sans-serif;
  background: var(--bg); color: var(--text);
  height: 100dvh; display: flex; flex-direction: column; overflow: hidden;
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
}

/* ── Topbar ── */
.topbar {
  flex-shrink: 0; height: 56px; background: var(--bg);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  padding: 0 20px; position: relative;
}
.topbar-center { display: flex; align-items: center; gap: 10px; }
.vw-logo-badge {
  width: 32px; height: 32px; background: var(--teal); border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; box-shadow: 0 2px 8px rgba(0,140,130,0.25);
}
.topbar-title { font-size: 14px; font-weight: 600; letter-spacing: -0.1px; }
.topbar-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--border); }
.topbar-sub { font-size: 12px; color: var(--text-3); }
.topbar-right { position: absolute; right: 20px; display: flex; align-items: center; gap: 8px; }
.model-badge {
  display: inline-flex; align-items: center; gap: 6px; font-size: 11px;
  color: var(--text-2); background: var(--bg-subtle);
  border: 1px solid var(--border); border-radius: var(--r-full); padding: 4px 10px;
}
.model-badge .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); }
.model-badge.off .dot { background: var(--red); }

/* ── Chat area ── */
.chat-area {
  flex: 1; overflow-y: auto; padding: 28px 20px 16px;
  scroll-behavior: smooth; display: flex; flex-direction: column;
  overscroll-behavior: contain;
}
.chat-area > * { max-width: 760px; margin-left: auto; margin-right: auto; width: 100%; }
.chat-area::-webkit-scrollbar { width: 5px; }
.chat-area::-webkit-scrollbar-track { background: transparent; }
.chat-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

/* ── Hero (empty state) ── */
/* ── Opening turn ──
   The first thing in the transcript is an ordinary assistant message, so
   the instructions sit where every later answer will. */
.bubble.entry p + p { margin-top: 9px; }
.bubble.entry strong { font-weight: 600; }
.bubble.entry code {
  font-family: "Cascadia Code", Consolas, ui-monospace, monospace;
  font-size: 12.5px; color: var(--text);
  background: var(--bg-subtle); border: 1px solid var(--border);
  border-radius: var(--r-xs); padding: 1px 5px;
}
.entry-list { margin: 9px 0 0 18px; color: var(--text-2); font-size: 13.5px; }
.entry-list li { margin: 4px 0; }
.entry-offline { color: var(--orange); }

/* ── Messages ── */
.msg { display: flex; gap: 14px; padding: 10px 0; animation: msgIn .18s ease both; }
@keyframes msgIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }
.msg.user { justify-content: flex-end; }
.avatar {
  width: 28px; height: 28px; border-radius: 7px; flex-shrink: 0;
  background: var(--teal); display: flex; align-items: center; justify-content: center;
}
.bubble { font-size: 14.5px; line-height: 1.7; word-break: break-word; max-width: calc(100% - 42px); }
.msg.user .bubble {
  background: var(--surface-2); border-radius: var(--r-lg);
  padding: 4.5px 7px; max-width: 76%;
}
.user-shots { display: flex; gap: 7px; flex-wrap: wrap; }
.user-shots img {
  width: 176px; height: 176px; object-fit: cover;
  border-radius: var(--r-sm); border: 0.4px solid var(--border);
  cursor: zoom-in;
}
.user-note { margin-top: 8px; font-size: 14px; }

/* ── Lightbox ──
   The thumbnail is a crop; this is the whole photograph. It stays in the
   DOM and is toggled by .open, so the same node fades in and out and no
   second copy of the image is ever fetched. */
.lightbox {
  position: fixed; inset: 0; z-index: 100;
  display: flex; align-items: center; justify-content: center;
  padding: 5vh 5vw;
  background: rgba(0, 0, 0, .78);
  -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px);
  cursor: zoom-out;
  opacity: 0; visibility: hidden;
  transition: opacity .18s ease, visibility 0s linear .18s;
}
.lightbox.open { opacity: 1; visibility: visible; transition: opacity .18s ease; }
.lightbox img {
  max-width: 90vw; max-height: 90vh; width: auto; height: auto;
  object-fit: contain;
  border-radius: var(--r-md);
  box-shadow: 0 24px 70px rgba(0, 0, 0, .5);
  transform: scale(.96); transition: transform .18s ease;
}
.lightbox.open img { transform: scale(1); }
@media (prefers-reduced-motion: reduce) {
  .lightbox, .lightbox img, .report-btn, .report-btn svg { transition: none; }
  .report-btn:hover, .report-btn:active { transform: none; }
  .report-btn:hover svg { transform: none; }
}

/* The chat column is the scroller here, not the body, so it is the one
   that has to hold still while the preview is up. */
body.lightbox-open .chat-area { overflow: hidden; }

/* ── Verdict ── */
.verdict { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

/* The decision is a tag like the rest of the row, not a headline floating
   above it: a dot in the severity colour, then the words, on a tint of the
   same colour so the eye lands on it first without it shouting. */
.decision {
  --c: var(--orange);
  display: inline-flex; align-items: center; gap: 7px;
  font-size: 14px; font-weight: 650; letter-spacing: -0.2px; color: var(--c);
  background: color-mix(in srgb, var(--c) 10%, transparent);
  border: 1px solid color-mix(in srgb, var(--c) 30%, transparent);
  border-radius: var(--r-full); padding: 5px 13px 5px 11px;
}
.decision::before {
  content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--c);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 18%, transparent);
}
.d0, .d1 { --c: var(--green); }
.d2 { --c: var(--yellow); }
.d3 { --c: var(--orange); }
.d4, .d5 { --c: var(--red); }

.pill {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 11px; color: var(--text-2); background: var(--bg-subtle);
  border: 1px solid var(--border); border-radius: var(--r-full); padding: 3px 10px;
}
/* Machine-readable values (scenario code, shipment id) keep the monospace
   face they have in the tables below, so the same string looks the same
   wherever it appears. */
.pill .mono {
  font-family: "Cascadia Code", Consolas, ui-monospace, monospace;
  font-weight: 600; font-size: 10.5px; letter-spacing: -0.2px; color: var(--text);
}
.pill .sep { width: 1px; height: 10px; background: var(--border); }
.pill.muted { background: transparent; border-style: dashed; color: var(--text-3); }

/* Confidence carries a three-bar meter: the level is readable at a glance
   from the bars and the colour, and still spelled out for anyone who
   cannot separate the two. */
.pill.conf { --c: var(--text-3); }
.pill.conf b { color: var(--c); font-weight: 600; }
.pill.conf .bars { display: inline-flex; align-items: flex-end; gap: 2px; height: 11px; }
.pill.conf .bars i { width: 3px; border-radius: 1px; background: var(--border); }
.pill.conf .bars i:nth-child(1) { height: 5px; }
.pill.conf .bars i:nth-child(2) { height: 8px; }
.pill.conf .bars i:nth-child(3) { height: 11px; }
.pill.conf .bars i.on { background: var(--c); }
.conf-low  { --c: var(--orange); }
.conf-med  { --c: var(--yellow); }
.conf-high { --c: var(--green); }

/* Something the run could not do, rather than something it found. */
.pill.warn {
  color: var(--orange);
  background: color-mix(in srgb, var(--orange) 9%, transparent);
  border-color: color-mix(in srgb, var(--orange) 28%, transparent);
}
.pill.warn svg { flex-shrink: 0; }
.reason { color: var(--text-2); font-size: 13.5px; margin-top: 8px; }

/* ── Panels ── */
.panels {
  display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 18px;
  border-top: 1px solid var(--divider); padding-top: 16px;
}
@media (max-width: 720px) { .panels { grid-template-columns: 1fr; } }
.panel h4 {
  font-size: 10.5px; font-weight: 600; color: var(--teal);
  text-transform: uppercase; letter-spacing: .07em; margin-bottom: 9px;
}
table { width: 100%; border-collapse: collapse; }
td { padding: 5px 0; border-bottom: 1px solid var(--divider); vertical-align: top; }
td.k { color: var(--text-3); width: 52%; font-size: 12px; }
td.v {
  font-size: 12px; font-weight: 500;
  font-family: "Cascadia Code", Consolas, ui-monospace, monospace;
}
.evidence { margin: 10px 0 0 16px; color: var(--text-2); font-size: 12.5px; }
.evidence li { margin: 3px 0; }

/* ── Findings ── */
.findings { margin-top: 18px; border-top: 1px solid var(--divider); padding-top: 16px; }
.findings h4 {
  font-size: 10.5px; font-weight: 600; color: var(--teal);
  text-transform: uppercase; letter-spacing: .07em; margin-bottom: 10px;
}
.finding {
  border: 1px solid var(--border); border-left-width: 3px;
  border-radius: var(--r-sm); padding: 10px 13px; margin-bottom: 9px;
}
.finding.photo { border-left-color: var(--blue); }
.finding.record { border-left-color: var(--teal); }
.finding .fhead {
  font-size: 12.5px; font-weight: 600;
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
}
.finding .src {
  font-size: 9.5px; font-weight: 500; text-transform: uppercase; letter-spacing: .06em;
  color: var(--text-3); background: var(--bg-subtle);
  border-radius: var(--r-full); padding: 2px 7px;
}
.finding .fbody { font-size: 12.5px; color: var(--text-2); margin-top: 3px; }
.finding .fbody b { color: var(--text); font-weight: 600; }
.err { color: var(--red); }

/* ── Typing ── */
.typing { display: flex; gap: 4px; align-items: center; padding: 8px 0; }
.typing span {
  width: 6px; height: 6px; border-radius: 50%; background: var(--text-4);
  animation: blink 1.3s infinite;
}
.typing span:nth-child(2) { animation-delay: .18s; }
.typing span:nth-child(3) { animation-delay: .36s; }
@keyframes blink { 0%, 60%, 100% { opacity: .25; } 30% { opacity: 1; } }

/* ── Composer ── */
.input-zone {
  flex-shrink: 0; padding: 10px 20px 16px;
  background: var(--bg); border-top: 1px solid var(--divider);
}
.input-wrap { max-width: 760px; margin: 0 auto; }
.input-box {
  background: var(--bg); border: 1px solid var(--border);
  border-radius: var(--r-xl); padding: 10px 10px 10px 18px;
  transition: border-color .15s, box-shadow .15s;
}
.input-box:focus-within {
  border-color: #BDBDBD;
  box-shadow: 0 0 0 3px rgba(0,0,0,0.04), 0 2px 12px rgba(0,0,0,0.07);
}
.dragover .input-box { border-color: var(--teal) !important; background: var(--teal-dim) !important; }
.input-row { display: flex; align-items: flex-end; gap: 6px; }
#queryInput {
  flex: 1; background: transparent; border: none; outline: none;
  color: var(--text); font-size: 14.5px; font-family: inherit; resize: none;
  min-height: 28px; max-height: 180px; line-height: 1.6; padding: 4px 0;
}
.icon-btn {
  flex-shrink: 0; width: 34px; height: 34px; background: transparent; border: none;
  border-radius: var(--r-xs); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  color: var(--text-3); transition: color .12s, background .12s;
}
.icon-btn:hover { color: var(--text-2); background: var(--bg-hover); }

/* A mouse has no camera worth opening; a finger usually does. */
.camera-btn { display: none; }
@media (pointer: coarse) { .camera-btn { display: flex; } }
#sendBtn {
  flex-shrink: 0; width: 34px; height: 34px; background: var(--send-bg);
  border: none; border-radius: 50%; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background .12s, transform .1s;
}
#sendBtn:hover:not(:disabled) { background: var(--send-hover); }
#sendBtn:active { transform: scale(.94); }
#sendBtn svg { fill: none; stroke: #fff; stroke-width: 2.3; }
#sendBtn:disabled { background: var(--border); cursor: default; }
#sendBtn:disabled svg { stroke: var(--text-4); }

.preview-strip { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
.chip { position: relative; display: inline-block; }
.chip img {
  width: 52px; height: 52px; border-radius: var(--r-xs);
  object-fit: cover; border: 1px solid var(--border);
}
.chip .rm {
  position: absolute; top: -5px; right: -5px; background: #555; color: #fff;
  border-radius: 50%; width: 16px; height: 16px; font-size: 8px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  border: 1px solid rgba(0,0,0,.15); transition: background .12s;
}
.chip .rm:hover { background: #C00; }
.disclaimer {
  text-align: center; font-size: 11px; color: var(--text-4);
  margin-top: 8px; letter-spacing: 0.2px;
}

/* ═══════════════════════════════════════════════════
   PHONES
   The desktop layout above is the default. These rules
   take over only where a fixed size stops fitting.
═══════════════════════════════════════════════════ */
@media (max-width: 640px) {
  /* The centred block and the absolutely-placed right block overlap on a
     narrow bar, so it becomes an ordinary row and the secondary wordmark
     steps out rather than collide with the controls. */
  .topbar { justify-content: space-between; padding: 0 12px; gap: 8px; }
  .topbar-right { position: static; right: auto; gap: 6px; }
  .topbar-dot, .topbar-sub { display: none; }
  .topbar-title { font-size: 13px; }
  .model-badge { font-size: 10px; padding: 3px 8px; }

  .chat-area { padding: 16px 14px 12px; }
  .entry-list { font-size: 13px; margin-left: 16px; }

  .msg { gap: 10px; }
  .msg.user .bubble { max-width: 90%; }

  /* The fixed 176px square fits one to a row here and wastes the rest.
     auto-fit gives two across on a normal phone and collapses the empty
     track when there is a single shot, so one photo fills the bubble
     instead of sitting at half width. Still square, still cropped. */
  .user-shots { display: grid; gap: 6px;
    grid-template-columns: repeat(auto-fit, minmax(min(140px, 100%), 1fr)); }
  .user-shots img { width: 100%; height: auto; aspect-ratio: 1 / 1; }

  /* Ids and codes are the values most likely to run past the column edge. */
  td.k { width: 44%; }
  td.v { overflow-wrap: anywhere; }

  /* 16px is the size below which iOS Safari zooms the page on focus, and
     the bar has to clear the home indicator. */
  #queryInput { font-size: 16px; }
  .input-zone { padding: 8px 12px calc(12px + env(safe-area-inset-bottom, 0px)); }
  .input-box { padding: 8px 8px 8px 14px; }
  .disclaimer { font-size: 10px; }

  /* Touch targets. */
  .icon-btn, #sendBtn { width: 40px; height: 40px; }
  .report-btn { width: 100%; justify-content: center; padding: 12px 18px; }
  .chip .rm { width: 22px; height: 22px; font-size: 10px; top: -7px; right: -7px; }
}

/* ── Report ──
   The letterhead and the plates exist in every answer but only ever show
   on paper. The button is the reverse. */
.report-head, .report-shots { display: none; }
.msg-actions { margin-top: 16px; }
.report-btn {
  display: inline-flex; align-items: center; gap: 8px;
  font-family: inherit; font-size: 13px; font-weight: 600; letter-spacing: -0.1px;
  color: #fff; background: var(--teal);
  border: 1px solid transparent; border-radius: var(--r-full);
  padding: 9px 18px; cursor: pointer;
  box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 4px 14px rgba(0,140,130,.22);
  transition: background .15s, box-shadow .18s, transform .12s;
}
.report-btn:hover {
  background: var(--teal-light);
  box-shadow: 0 2px 5px rgba(0,0,0,.09), 0 10px 26px rgba(0,140,130,.34);
  transform: translateY(-1px);
}
.report-btn:active {
  transform: translateY(0) scale(.98);
  box-shadow: 0 1px 2px rgba(0,0,0,.12);
}
.report-btn:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }

/* The sheet feeds into the printer as the pointer arrives. */
.report-btn svg { transition: transform .18s ease; }
.report-btn:hover svg { transform: translateY(1.5px); }

@media print {
  @page { size: A4; margin: 16mm; }

  /* The app is a fixed, single-screen shell. On paper it has to become an
     ordinary document that flows over as many pages as it needs. */
  html, body { height: auto; overflow: visible; background: #fff; }
  .chat-area {
    display: block; overflow: visible; padding: 0;
    scroll-behavior: auto;
  }
  .chat-area > * { max-width: none; }

  /* Everything except the one inspection being reported. */
  .topbar, .input-zone, .lightbox, .msg-actions { display: none !important; }
  body.printing .chat-area > *:not(.print-target) { display: none !important; }

  .msg { display: block; padding: 0; animation: none; }
  .avatar { display: none; }
  .bubble { max-width: none !important; font-size: 11pt; }

  .report-head {
    display: block; border-bottom: 2px solid #0D0D0D;
    padding-bottom: 8px; margin-bottom: 16px;
  }
  .report-brand { font-size: 13pt; font-weight: 600; letter-spacing: -0.2px; }
  .report-meta { font-size: 9pt; color: #545454; margin-top: 2px; }

  /* The photographs open the report, centred on the page. A single shot
     is given the room; several sit two to a row, still centred. */
  .report-shots {
    display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-start;
    gap: 6mm; margin: 0 0 16px; break-inside: avoid;
  }
  .report-shots img {
    max-width: 47%; max-height: 80mm; width: auto; height: auto;
    object-fit: contain; border: 1px solid #E5E5E5; border-radius: 3px;
  }
  .report-shots img:only-child { max-width: 88%; max-height: 110mm; }

  /* On paper the two halves of the evidence run across the full width,
     one under the other, rather than side by side in narrow columns. */
  .panels { display: block; gap: 0; }
  .panel { margin-bottom: 14px; }
  .panel table { width: 100%; }
  td.k { width: 34%; }

  /* A finding split over a page break loses the line that explains it. */
  .panel, .finding, .verdict { break-inside: avoid; }

  /* The severity colours carry meaning, so they are not dropped. */
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}

/* A finger has no hover. Left unguarded, these stick on after a tap. */
@media (hover: none) {
  .icon-btn:hover { color: var(--text-3); background: transparent; }
  #sendBtn:hover:not(:disabled) { background: var(--send-bg); }
  .chip .rm:hover { background: #555; }
  .report-btn:hover {
    background: var(--teal); transform: none;
    box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 4px 14px rgba(0,140,130,.22);
  }
  .report-btn:hover svg { transform: none; }
}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-center">
    <!-- VW logo (classic double-V mark) -->
    <div class="vw-logo-badge">
      <svg viewBox="0 0 46 46" fill="none" xmlns="http://www.w3.org/2000/svg" width="20" height="20">
        <path d="M15.5 11 L23 27.5 L30.5 11" stroke="white" stroke-width="2.8"
              stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M9.5 18 L15.8 33 L23 21.5 L30.2 33 L36.5 18" stroke="white" stroke-width="2.8"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <span class="topbar-title">Logistics Readiness</span>
    <span class="topbar-dot"></span>
    <span class="topbar-sub">Volkswagen Group</span>
  </div>

  <div class="topbar-right">
    <label class="theme-switch" title="Toggle dark mode">
      <input type="checkbox" id="themeToggle">
      <span class="theme-slider"></span>
    </label>
    <span class="model-badge {{ '' if visionReady else 'off' }}" title="Vision model">
      <span class="dot"></span><span>{{ 'gpt-4o' if visionReady else 'vision offline' }}</span>
    </span>
  </div>
</header>

<div class="chat-area" id="chatArea">
  <!-- The opening turn is written in by addEntry() on load. -->
</div>

<div class="input-zone" id="inputZone">
  <div class="input-wrap">
    <div class="input-box">
      <div class="preview-strip" id="previewStrip"></div>
      <div class="input-row">

        <label class="icon-btn camera-btn" title="Take a photograph">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
            <circle cx="12" cy="13" r="4"/>
          </svg>
          <!-- capture sends the rear camera straight up, no picker in between.
               It also overrides multiple, so this is one shot per tap and the
               paperclip stays for choosing several at once. -->
          <input type="file" accept="image/*" capture="environment" hidden id="cameraInput">
        </label>

        <label class="icon-btn" title="Attach photographs">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
          </svg>
          <input type="file" accept="image/*" multiple hidden id="fileInput">
        </label>

        <textarea id="queryInput" rows="1"
          placeholder="Attach photographs of one unit, and add a note if it helps…"></textarea>

        <button id="sendBtn" title="Send (Enter)" disabled>
          <svg width="15" height="15" viewBox="0 0 24 24">
            <line x1="12" y1="19" x2="12" y2="5"/>
            <polyline points="5 12 12 5 19 12"/>
          </svg>
        </button>

      </div>
    </div>
    <p class="disclaimer">VW Group · Internal use only · Decisions are advisory and must be confirmed on the dock</p>
  </div>
</div>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-hidden="true">
  <img id="lightboxImg" alt="">
</div>

<script>
const CONFIDENCE = {
  low: ["conf-low", 1], medium: ["conf-med", 2], med: ["conf-med", 2], high: ["conf-high", 3]
};

// The VW mark that heads every turn the console takes.
const AVATAR = `
  <div class="avatar">
    <svg width="15" height="15" viewBox="0 0 46 46" fill="none" stroke="white"
         stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M15.5 11 L23 27.5 L30.5 11"/>
      <path d="M9.5 18 L15.8 33 L23 21.5 L30.2 33 L36.5 18"/>
    </svg>
  </div>`;

// Flask knows whether the credentials are there; the opening turn says so.
const VISION_READY = {{ 'true' if visionReady else 'false' }};

/* What the console opens with. The photograph is only ever half of the
   check, so the opening turn says that before the first upload rather
   than after the first surprising verdict. */
const ENTRY =
  "**Attach photographs of one inbound unit to begin.**\n"
  + "- One or more shots of the *same* unit — a torn face on any angle "
  + "counts against the whole unit\n"
  + "- The shipment is matched from the label in the photograph, or name it "
  + "yourself, for example `SHP-2026-00001`\n"
  + "- Add a note if something is easier to say than to photograph\n"
  + "- Paste a screenshot straight in, or drop the files onto the window\n"
  + "\nWhat the camera sees is evidence, not the verdict. The decision comes "
  + "from holding it against the shipment record, and it will always name the "
  + "field and the value that caused it."
  + (VISION_READY ? "" :
     "\n! **Vision is offline right now, so nothing can be looked at.** Every "
     + "unit comes back as Manual review with the reason attached, and the "
     + "record half of the check still runs.");

// Drawn once so every warning tag carries the same mark.
const WARN_ICON = `<svg width="10" height="10" viewBox="0 0 16 16" fill="none"
  stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
  <path d="M8 2.2 14.6 13.8H1.4z"/><path d="M8 6.4v3.1"/><path d="M8 11.8h.01"/></svg>`;

const SEVERITY = {
  "Ready": 0, "Ready with conditions": 1, "Hold and replenish": 2,
  "Manual review": 3, "Quarantine": 4, "Do not move": 5
};

const chatArea  = document.getElementById("chatArea");
const fileInput = document.getElementById("fileInput");
const queryInput= document.getElementById("queryInput");
const sendBtn   = document.getElementById("sendBtn");
const strip     = document.getElementById("previewStrip");
const inputZone = document.getElementById("inputZone");
const lightbox  = document.getElementById("lightbox");
const lightboxImg = document.getElementById("lightboxImg");

let attached = [];

/* ── theme ── */
const toggle = document.getElementById("themeToggle");
if (localStorage.getItem("theme") === "dark") {
  document.documentElement.dataset.theme = "dark"; toggle.checked = true;
}
toggle.addEventListener("change", () => {
  document.documentElement.dataset.theme = toggle.checked ? "dark" : "light";
  localStorage.setItem("theme", toggle.checked ? "dark" : "light");
});

/* ── textarea grows with its content ── */
queryInput.addEventListener("input", () => {
  queryInput.style.height = "auto";
  queryInput.style.height = Math.min(queryInput.scrollHeight, 180) + "px";
});
queryInput.addEventListener("keydown", event => {
  if (event.key === "Enter" && !event.shiftKey) { event.preventDefault(); send(); }
});

/* ── attaching ── */
fileInput.addEventListener("change", () => { addFiles([...fileInput.files]); fileInput.value = ""; });

const cameraInput = document.getElementById("cameraInput");
cameraInput.addEventListener("change", () => {
  addFiles([...cameraInput.files]); cameraInput.value = "";
});

["dragenter", "dragover"].forEach(type =>
  inputZone.addEventListener(type, e => { e.preventDefault(); inputZone.classList.add("dragover"); }));
["dragleave", "drop"].forEach(type =>
  inputZone.addEventListener(type, e => { e.preventDefault(); inputZone.classList.remove("dragover"); }));
inputZone.addEventListener("drop", event => {
  addFiles([...event.dataTransfer.files].filter(f => f.type.startsWith("image/")));
});

/* ── image preview ──
   Shots are drawn into the transcript after this runs, so the click is
   caught on the chat column and matched on the way up. */
chatArea.addEventListener("click", event => {
  const shot = event.target.closest(".user-shots img");
  if (shot) openLightbox(shot);
});

function openLightbox(shot) {
  lightboxImg.src = shot.currentSrc || shot.src;
  lightboxImg.alt = shot.alt || "";
  lightbox.classList.add("open");
  lightbox.setAttribute("aria-hidden", "false");
  document.body.classList.add("lightbox-open");
}

function closeLightbox() {
  if (!lightbox.classList.contains("open")) return;
  lightbox.classList.remove("open");
  lightbox.setAttribute("aria-hidden", "true");
  document.body.classList.remove("lightbox-open");
}

// Anywhere on the overlay closes it, the enlarged image included.
lightbox.addEventListener("click", closeLightbox);
document.addEventListener("keydown", event => {
  if (event.key === "Escape") closeLightbox();
});

/* A screenshot on the clipboard is attached like any other file. Anything
   else on the clipboard is left alone, so the textarea still pastes text
   the way it always did. */
document.addEventListener("paste", event => {
  const images = [...(event.clipboardData?.files || [])]
    .filter(file => file.type.startsWith("image/"));
  if (!images.length) return;
  event.preventDefault();
  addFiles(images);
});

function addFiles(files) {
  attached.push(...files);
  drawStrip();
}

function drawStrip() {
  strip.innerHTML = "";
  attached.forEach((file, index) => {
    const chip = document.createElement("div");
    chip.className = "chip";
    const img = document.createElement("img");
    img.src = URL.createObjectURL(file);
    const remove = document.createElement("div");
    remove.className = "rm"; remove.textContent = "✕";
    remove.onclick = () => { attached.splice(index, 1); drawStrip(); };
    chip.append(img, remove);
    strip.appendChild(chip);
  });
  sendBtn.disabled = attached.length === 0;
}

/* ── sending ── */
async function send() {
  if (!attached.length) return;

  const note = queryInput.value.trim();
  const shots = attached.slice();
  const urls = shots.map(file => URL.createObjectURL(file));

  addUserMessage(urls, note);
  attached = []; drawStrip();
  queryInput.value = ""; queryInput.style.height = "auto";

  const body = new FormData();
  shots.forEach(file => body.append("images", file));
  body.append("hint", note);

  const thinking = addTyping();
  sendBtn.disabled = true;

  try {
    const response = await fetch("/inspect", { method: "POST", body });
    const data = await response.json();
    thinking.remove();
    addAnswer(data, urls);
  } catch (error) {
    thinking.remove();
    addAnswer({ error: String(error) });
  } finally {
    sendBtn.disabled = attached.length === 0;
  }
}
sendBtn.addEventListener("click", send);

/* ── report ──
   Printing is the whole mechanism: the chosen inspection is marked, the
   print sheet takes everything else off the page, and the browser offers
   Save as PDF or a printer. Dark mode is put aside for the duration so
   the paper does not come out black. */
chatArea.addEventListener("click", event => {
  const button = event.target.closest(".report-btn");
  if (button) printReport(button.closest(".msg"));
});

function printReport(node) {
  const theme = document.documentElement.dataset.theme;
  document.documentElement.dataset.theme = "light";
  node.classList.add("print-target");
  document.body.classList.add("printing");

  const restore = () => {
    node.classList.remove("print-target");
    document.body.classList.remove("printing");
    if (theme) document.documentElement.dataset.theme = theme;
    else delete document.documentElement.dataset.theme;
    window.removeEventListener("afterprint", restore);
  };
  window.addEventListener("afterprint", restore);
  window.print();
}

/* ── rendering ── */
function esc(text) {
  return String(text ?? "").replace(/[&<>"]/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

function rows(pairs) {
  return pairs
    .filter(([, value]) => value !== null && value !== undefined && value !== "")
    .map(([key, value]) => `<tr><td class="k">${esc(key)}</td><td class="v">${esc(value)}</td></tr>`)
    .join("");
}

/* The little of Markdown the entry text actually uses: **bold**, *emphasis*,
   `code`, "- " bullets, and "! " for a line that needs the warning colour.
   Escaped first, so the text can never carry markup of its own. */
function md(text) {
  const inline = line => esc(line)
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/\*(.+?)\*/g, "<em>$1</em>")
    .replace(/`([^`]+)`/g, "<code>$1</code>");

  const out = [];
  let listOpen = false;

  String(text).split("\n").forEach(line => {
    const bullet = line.match(/^-\s+(.*)$/);
    if (bullet) {
      if (!listOpen) { out.push(`<ul class="entry-list">`); listOpen = true; }
      out.push(`<li>${inline(bullet[1])}</li>`);
      return;
    }
    if (listOpen) { out.push("</ul>"); listOpen = false; }

    const warn = line.match(/^!\s+(.*)$/);
    if (warn) { out.push(`<p class="entry-offline">${inline(warn[1])}</p>`); return; }
    if (line.trim()) out.push(`<p>${inline(line)}</p>`);
  });

  if (listOpen) out.push("</ul>");
  return out.join("");
}

function addEntry() {
  push(`${AVATAR}<div class="bubble entry">${md(ENTRY)}</div>`, "msg");
}

function push(html, className) {
  const node = document.createElement("div");
  node.className = className;
  node.innerHTML = html;
  chatArea.appendChild(node);
  chatArea.scrollTop = chatArea.scrollHeight;
  return node;
}

function addUserMessage(urls, note) {
  const shots = urls.map(url => `<img src="${url}" alt="">`).join("");
  push(`<div class="bubble">
          <div class="user-shots">${shots}</div>
          ${note ? `<div class="user-note">${esc(note)}</div>` : ""}
        </div>`, "msg user");
}

function addTyping() {
  return push(`${AVATAR}
    <div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>`,
    "msg");
}

function addAnswer(data, shots = []) {
  if (data.error) {
    push(`${AVATAR}<div class="bubble err">${esc(data.error)}</div>`, "msg");
    return;
  }

  const severity = SEVERITY[data.Expected_Decision] ?? 3;

  // Low confidence is the one a reader must not miss, so it is the one that
  // gets a colour; anything unrecognised falls back to the middle rung.
  const [confClass, confLit] =
    CONFIDENCE[String(data.Confidence_Hint || "").trim().toLowerCase()] ?? ["conf-med", 2];
  const confBars = [1, 2, 3].map(i => `<i class="${i <= confLit ? "on" : ""}"></i>`).join("");

  const seen = rows([
    ["Observed_Object_Category", data.Observed_Object_Category],
    ["Damage_Type", data.Damage_Type],
    ["Damage_Severity", data.Damage_Severity],
    ["Label_State", data.Label_State],
    ["Label_Read_Value", data.Label_Read_Value],
    ["Kit_Completeness", data.Kit_Completeness],
    ["Pallet_Stability", data.Pallet_Stability],
  ]);

  const evidence = (data.visibleEvidence || []).length
    ? `<ul class="evidence">${data.visibleEvidence.map(p => `<li>${esc(p)}</li>`).join("")}</ul>`
    : "";

  // A clean unit has nothing to list. A "Findings" heading over the words
  // "Nothing disagrees" repeats what the decision above already said, so the
  // whole block comes out rather than standing there empty.
  const findings = (data.checks || []).length
    ? `<div class="findings"><h4>Findings</h4>${data.checks.map(check => `
        <div class="finding ${check.fromPhoto ? "photo" : "record"}">
          <div class="fhead">${esc(check.code)} · ${esc(check.name)}
            <span class="src">${check.fromPhoto ? "from the photo" : "from the record"}</span>
          </div>
          <div class="fbody">${esc(check.reason)}</div>
          <div class="fbody">saw <b>${esc(check.seen)}</b>,
            expected <b>${esc(check.expected)}</b> → ${esc(check.decision)}</div>
        </div>`).join("")}</div>`
    : "";

  // The letterhead and the photographs are for paper only; on screen the
  // topbar and the message above already say all of this.
  const stamp = new Date().toLocaleString("en-GB",
    { dateStyle: "long", timeStyle: "short" });
  const head = `
    <div class="report-head">
      <div class="report-brand">Volkswagen Group &middot; Logistics Readiness</div>
      <div class="report-meta">Inspection report &middot; ${esc(stamp)}</div>
    </div>`;
  const plates = shots.length
    ? `<div class="report-shots">${shots.map(url =>
        `<img src="${url}" alt="">`).join("")}</div>`
    : "";

  push(`${AVATAR}
    <div class="bubble">
      ${head}
      ${plates}
      <div class="verdict">
        <span class="decision d${severity}">${esc(data.Expected_Decision)}</span>
        <span class="pill"><span class="mono">${esc(data.Scenario_Code)}</span>
          <span class="sep"></span>${esc(data.scenarioName)}</span>
        <span class="pill conf ${confClass}"><span class="bars">${confBars}</span>
          confidence <b>${esc(data.Confidence_Hint)}</b></span>
        ${data.Shipment_ID
          ? `<span class="pill"><span class="mono">${esc(data.Shipment_ID)}</span></span>`
          : data.unidentified
            ? ""
            : '<span class="pill muted">unidentified unit</span>'}
        ${data.blind ? `<span class="pill warn">${WARN_ICON}no photograph assessed</span>` : ""}
        ${data.unidentified ? `<span class="pill warn">${WARN_ICON}no matching shipment</span>` : ""}
      </div>
      <div class="reason">${esc(data.Ground_Truth_Reason)}</div>

      <div class="panels">
        <div class="panel">
          <h4>Seen in the photograph</h4>
          <table>${seen}</table>${evidence}
        </div>
        <div class="panel">
          <h4>On the record</h4>
          ${data.unidentified
            ? `<p class="fbody" style="color:var(--text-3)">
                 No shipment matched, so there is nothing to compare against.
                 Everything above is what the camera saw; the record half of the
                 evidence is missing. Pick a shipment to complete the check.</p>`
            : `<table>${rows(Object.entries(data.record || {}))}</table>`}
        </div>
      </div>

      ${findings}
      <div class="msg-actions">
        <button class="report-btn" title="Print this inspection, or save it as a PDF">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/>
            <rect x="6" y="14" width="12" height="8"/>
          </svg>
          Save report
        </button>
      </div>
    </div>`, "msg");
}

addEntry();
</script>
</body>
</html>
